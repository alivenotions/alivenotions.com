<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Jim Morrison in dot pixel art</title>
  <desc id="desc">A monochrome halftone portrait of Jim Morrison wearing aviator sunglasses.</desc>
  <defs>
    <pattern id="small-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#171717"/>
      <circle cx="6" cy="6" r=".8" fill="#171717"/>
    </pattern>
    <pattern id="medium-dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.3" fill="#171717"/>
      <circle cx="8" cy="8" r="1.2" fill="#171717"/>
    </pattern>
    <pattern id="heavy-dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="3" fill="#171717"/>
      <circle cx="8" cy="8" r="1.8" fill="#171717"/>
    </pattern>
    <clipPath id="face">
      <polygon points="235,70 365,70 403,118 397,238 361,315 300,345 239,315 203,238 197,118"/>
    </clipPath>
  </defs>

  <rect width="600" height="400" fill="#f3f3f3"/>

  <!-- poster wall -->
  <path d="M0 0H600V76H0ZM0 310H600V400H0Z" fill="url(#small-dots)" opacity=".42"/>
  <path d="M0 88H155V112H0ZM445 88H600V112H445ZM0 126H136V148H0ZM464 126H600V148H464Z" fill="#171717" opacity=".22"/>
  <path d="M0 82H600M0 118H600M0 154H600M0 324H600M0 362H600" stroke="#171717" stroke-width="3" stroke-dasharray="5 7" opacity=".36"/>

  <!-- dark wavy hair -->
  <polygon points="174,51 214,18 264,5 300,16 338,3 391,23 429,57 450,108 440,164 459,211 443,270 458,322 415,370 368,384 349,334 251,334 232,384 184,369 143,322 157,269 141,214 159,163 149,108"
    fill="#171717"/>
  <path d="M179 67L210 27 240 48 267 13 298 43 331 10 357 45 391 30 416 72 396 104 430 127 405 165 438 201 409 230 435 273 397 294 409 342 371 364 344 317H255L229 364 190 340 202 296 166 273 191 232 158 203 190 165 164 128 199 105Z"
    fill="url(#heavy-dots)"/>
  <g fill="#f3f3f3" opacity=".34">
    <rect x="164" y="99" width="9" height="29"/><rect x="178" y="68" width="8" height="21"/>
    <rect x="193" y="46" width="8" height="34"/><rect x="414" y="77" width="8" height="32"/>
    <rect x="431" y="111" width="8" height="28"/><rect x="151" y="191" width="9" height="32"/>
    <rect x="439" y="193" width="9" height="33"/><rect x="171" y="266" width="8" height="29"/>
    <rect x="420" y="263" width="8" height="34"/><rect x="198" y="319" width="8" height="30"/>
    <rect x="394" y="316" width="8" height="31"/>
  </g>

  <!-- face -->
  <polygon points="235,70 365,70 403,118 397,238 361,315 300,345 239,315 203,238 197,118"
    fill="#f3f3f3"/>
  <g clip-path="url(#face)">
    <path d="M195 68H249L231 119 218 181 226 251 249 316H188ZM405 68H352L370 120 383 183 374 250 351 316H412Z"
      fill="url(#medium-dots)"/>
    <path d="M230 250C250 286 264 317 300 331C335 318 350 286 371 249L359 330H240Z"
      fill="url(#small-dots)" opacity=".62"/>
    <path d="M273 172L300 158 328 172 319 255 300 271 281 255Z"
      fill="url(#small-dots)" opacity=".46"/>
  </g>

  <!-- aviator sunglasses -->
  <path d="M201 139L218 119 282 116 300 131 318 116 382 119 399 139 389 193 366 214 327 210 307 187 300 151 293 187 273 210 234 214 211 193Z"
    fill="#171717"/>
  <path d="M213 139L229 127 278 126 290 138 284 177 268 197 237 201 220 187Z"
    fill="#3a3a3a"/>
  <path d="M310 138L322 126 371 127 387 139 380 187 363 201 332 197 316 177Z"
    fill="#3a3a3a"/>
  <path d="M223 139L274 130M218 151L279 139M326 135L379 149M322 145L376 160"
    stroke="#f3f3f3" stroke-width="7" opacity=".78"/>
  <path d="M203 136L158 126M397 136L442 126" stroke="#171717" stroke-width="8"/>
  <rect x="291" y="134" width="18" height="8" fill="#171717"/>

  <!-- nose, mouth, and facial shadows -->
  <path d="M298 176L286 246 300 260 316 248" fill="none" stroke="#171717" stroke-width="6"/>
  <path d="M281 267L300 273 320 267 339 283 318 301 281 301 261 284Z" fill="url(#medium-dots)"/>
  <path d="M263 282L282 278 300 282 318 278 337 283 318 290 282 290Z" fill="#171717"/>
  <path d="M273 304L300 310 328 304" fill="none" stroke="#171717" stroke-width="4" stroke-dasharray="5 4"/>
  <path d="M224 222L231 260 249 288M376 222L369 260 351 288" fill="none" stroke="#171717" stroke-width="5" stroke-dasharray="3 7"/>

  <!-- squared pixel accents -->
  <g fill="#171717">
    <rect x="191" y="92" width="8" height="8"/><rect x="207" y="76" width="7" height="7"/>
    <rect x="224" y="57" width="9" height="9"/><rect x="243" y="42" width="6" height="6"/>
    <rect x="401" y="91" width="8" height="8"/><rect x="386" y="75" width="7" height="7"/>
    <rect x="368" y="55" width="9" height="9"/><rect x="351" y="40" width="6" height="6"/>
    <rect x="213" y="238" width="7" height="7"/><rect x="382" y="238" width="7" height="7"/>
    <rect x="235" y="303" width="8" height="8"/><rect x="358" y="303" width="8" height="8"/>
  </g>
</svg>
