<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">One-bit open door</title>
  <desc id="desc">A black and cream pixel-art doorway opening from a dark room onto a moonlit desert.</desc>
  <rect width="600" height="760" fill="#f3f3f3"/>
  <rect x="20" y="20" width="560" height="720" fill="#171717"/>

  <!-- one-bit wall texture -->
  <g fill="#f3f3f3">
    <rect x="40" y="50" width="80" height="10"/><rect x="150" y="50" width="40" height="10"/>
    <rect x="410" y="50" width="60" height="10"/><rect x="500" y="50" width="50" height="10"/>
    <rect x="50" y="90" width="40" height="10"/><rect x="120" y="90" width="70" height="10"/>
    <rect x="420" y="90" width="40" height="10"/><rect x="490" y="90" width="70" height="10"/>
    <rect x="30" y="130" width="100" height="10"/><rect x="160" y="130" width="30" height="10"/>
    <rect x="410" y="130" width="90" height="10"/><rect x="530" y="130" width="40" height="10"/>
    <rect x="50" y="170" width="50" height="10"/><rect x="130" y="170" width="60" height="10"/>
    <rect x="410" y="170" width="50" height="10"/><rect x="490" y="170" width="60" height="10"/>
    <rect x="30" y="210" width="70" height="10"/><rect x="130" y="210" width="60" height="10"/>
    <rect x="410" y="210" width="70" height="10"/><rect x="510" y="210" width="60" height="10"/>
    <rect x="40" y="250" width="110" height="10"/><rect x="170" y="250" width="20" height="10"/>
    <rect x="410" y="250" width="30" height="10"/><rect x="470" y="250" width="90" height="10"/>
    <rect x="30" y="290" width="50" height="10"/><rect x="110" y="290" width="80" height="10"/>
    <rect x="410" y="290" width="80" height="10"/><rect x="520" y="290" width="50" height="10"/>
    <rect x="40" y="330" width="80" height="10"/><rect x="150" y="330" width="40" height="10"/>
    <rect x="410" y="330" width="60" height="10"/><rect x="500" y="330" width="60" height="10"/>
    <rect x="30" y="370" width="60" height="10"/><rect x="120" y="370" width="70" height="10"/>
    <rect x="410" y="370" width="90" height="10"/><rect x="530" y="370" width="40" height="10"/>
    <rect x="40" y="410" width="100" height="10"/><rect x="170" y="410" width="20" height="10"/>
    <rect x="410" y="410" width="40" height="10"/><rect x="480" y="410" width="80" height="10"/>
  </g>

  <!-- frame and world beyond -->
  <rect x="170" y="100" width="260" height="570" fill="#f3f3f3"/>
  <rect x="190" y="120" width="220" height="550" fill="#171717"/>
  <rect x="210" y="140" width="180" height="510" fill="#f3f3f3"/>

  <!-- pixel moon -->
  <g fill="#171717">
    <rect x="290" y="180" width="60" height="10"/>
    <rect x="270" y="190" width="100" height="10"/>
    <rect x="260" y="200" width="120" height="50"/>
    <rect x="270" y="250" width="100" height="10"/>
    <rect x="290" y="260" width="60" height="10"/>
  </g>
  <g fill="#f3f3f3">
    <rect x="260" y="200" width="30" height="20"/>
    <rect x="350" y="230" width="30" height="20"/>
    <rect x="290" y="250" width="20" height="10"/>
  </g>

  <!-- desert pixels -->
  <g fill="#171717">
    <rect x="210" y="420" width="180" height="230"/>
    <rect x="210" y="400" width="30" height="20"/><rect x="240" y="390" width="40" height="30"/>
    <rect x="280" y="400" width="30" height="20"/><rect x="310" y="380" width="30" height="40"/>
    <rect x="340" y="400" width="20" height="20"/><rect x="360" y="390" width="30" height="30"/>
  </g>
  <g fill="#f3f3f3">
    <rect x="230" y="460" width="30" height="10"/><rect x="280" y="450" width="60" height="10"/>
    <rect x="350" y="470" width="20" height="10"/><rect x="250" y="500" width="50" height="10"/>
    <rect x="320" y="510" width="50" height="10"/><rect x="220" y="550" width="30" height="10"/>
    <rect x="270" y="540" width="30" height="10"/><rect x="340" y="560" width="40" height="10"/>
    <rect x="240" y="600" width="60" height="10"/><rect x="330" y="610" width="30" height="10"/>
  </g>

  <!-- open door slab -->
  <path d="M190 120H300V620L190 670Z" fill="#171717"/>
  <path d="M210 150H280V600L210 630Z" fill="#f3f3f3"/>
  <rect x="260" y="380" width="20" height="20" fill="#171717"/>

  <!-- light cast onto room floor -->
  <path d="M190 670L300 620L410 670L520 720H80Z" fill="#f3f3f3"/>
  <path d="M210 670L300 640L390 670L460 710H140Z" fill="#171717"/>
  <g fill="#f3f3f3">
    <rect x="170" y="690" width="50" height="10"/><rect x="250" y="680" width="30" height="10"/>
    <rect x="320" y="690" width="70" height="10"/><rect x="410" y="710" width="20" height="10"/>
  </g>
</svg>
